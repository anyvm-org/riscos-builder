# RISC OS 5.30 (15 May 2024), 32-bit ARM, from RISC OS Open's official
# Raspberry Pi SD card image.
#
# STATUS: tech preview. Remote command execution and file sync both work
# (VM_TRANSPORT=telnet + VM_SYNC_METHODS=tar, see below). The desktop comes up
# and the VNC console shows it. There is no keyboard, and pointer input is
# untested -- the ROM does carry a usbmouse driver, but no USB mouse has been
# attached to this guest, so do not claim it works;
# that is a RISC OS limitation, not a QEMU one, and it is what shapes this
# whole builder. See "No keyboard" below.
#
# ---------------------------------------------------------------------------
# Nothing from RISC OS Open is vendored in this repo
# ---------------------------------------------------------------------------
# hooks/host_beforeBuild.sh downloads the SD image from riscosopen.org at
# build time and this repo's release assets carry only our own work: the
# patched QEMU, the agent, and the injector. VM_ISO_LINK below is the single
# declared upstream source -- it is what hooks/upstream_check.py compares
# against and what base-builder/watch.py HEADs on a release bump.
#
# NOTE for the watcher: ROOL deletes superseded media. The 5.30 zip answers
# 200 while the identically-shaped 5.28 URL answers 404, so a new release
# does not add a row, it REPLACES one -- hooks/upstream_check.py sets
# ALL_RELEASES_UPDATE=replace, the same thing plan9-builder needs because
# 9front also deletes old media. Without it every superseded release becomes
# one permanently red build.
#
# ---------------------------------------------------------------------------
# QEMU: no working RISC OS port existed, so this builder makes one
# ---------------------------------------------------------------------------
# Stock QEMU cannot boot RISC OS on any raspi machine. files/
# qemu-riscos-raspi.patch is eight fixes plus a new USB NIC model, built by
# files/build-qemu-riscos.sh and published as this repo's own release asset
# (never referenced from a sibling builder -- deleting any one builder must
# not affect another).
#
# Four of the eight are GENERIC QEMU defects with nothing to do with RISC OS
# and are worth upstreaming:
#   * hcd-dwc2.c frame counter divided elapsed time by s->fi (the frame
#     interval in PHY clocks) instead of s->usb_frame_time, so the counter
#     ran at the wrong rate;
#   * hcd-dwc2.c raised GINTSTS_HCHINT without ever lowering it;
#   * hcd-dwc2.c started the bus from dwc2_attach() rather than on the
#     HPRT0 port-enable edge;
#   * bcm2835_dma.c did `xlen -= 4` on a uint32_t byte count, so any length
#     that is not a multiple of four wraps and the loop spins ~2^30 times
#     while scribbling over guest memory.
# The RISC OS specific ones: a bcm2835 mailbox power channel (channel 0), a
# VCHIQ mailbox peer, byte access on the bcm2835 interrupt controller and on
# the BSC/I2C FIFO (RISC OS uses LDRB/STRB where the QEMU models demanded
# word access), and hw/usb/dev-smsc95xx.c, a model of the LAN9512 that is
# the real Pi 2's NIC -- the guest has a driver for it and for nothing else
# QEMU offers.
# The extracted directory is qemu10-riscos-arm, not qemu10-riscos: it must
# match what files/build-qemu-riscos.sh actually packs (`tar -C "$pkg"
# qemu10-riscos-arm`), because setup() extracts the tarball where it stands
# and resolve_qemu_bin() then uses VM_QEMU_BIN verbatim -- a wrong directory
# here is a QEMU that launches from a path that does not exist.
VM_QEMU_TAR="build/qemu-10.2.3-riscos-arm-noble.tar.zst"
VM_QEMU_BIN="qemu10-riscos-arm/bin/qemu-system-arm"

VM_OS_NAME="riscos"
VM_RELEASE=5.30
VM_ARCH=armv7

# Cortex-A7, i.e. the Raspberry Pi 2. Not aarch64: RISC OS is a 32-bit ARM
# operating system and has no 64-bit port. One ROOL image covers every Pi
# model, so there is exactly one image and one arch here.
#
# VHD, not ISO: there is no installer to run. RISC OS Open publishes a
# ready-made SD card image, so this builder takes the same shape as
# hurd/ubuntu/openeuler -- _prep_vhd_disk() materialises the qcow2 and a
# prepareImage hook adjusts it -- rather than the ISO-install shape. It also
# matters which of the two is set: main() tests VM_ISO_LINK first, so setting
# that would send this guest down the installer path and never reach
# prepareImage at all.
#
# _prep_vhd_disk() dispatches on the URL suffix and its zip branch (added for
# nextbsd) extracts the single *.img member by suffix, which is exactly
# ROOL's layout -- riscos-pi.img inside RISCOSPi.<ver>.zip. The branch tests
# for "img.zip" though, and this URL ends in plain ".zip", so base-builder
# needs that condition widened by one suffix.
VM_VHD_LINK="https://www.riscosopen.org/zipfiles/platform/raspberry-pi/RISCOSPi.5.30.zip"

VM_SSH_PORT=2222

# ---------------------------------------------------------------------------
# Transport: raw TCP
# ---------------------------------------------------------------------------
# RISC OS ships NO remote-access server of any kind. Checked in a running
# guest rather than assumed: `*Modules` lists 137 modules and the only
# networking among them is the stack and its clients --
#
#   Internet Resolver DHCP BootNet NetTime EtherUSB MbufManager
#   NetFiler NetStatus       (stack, DHCP, the USB NIC driver, status UI)
#   LanManFS                 (SMB CLIENT)
#   ShareFS Freeway          (Acorn Access peer sharing, a proprietary
#                             protocol nothing on the host side speaks)
#   !Omni                    (a desktop front-end for those clients)
#
# -- no telnetd, no sshd, no ftpd. So, like reactos-builder, this builder has
# to SUPPLY the server.
#
# That server is files/anyvmd.py: a small Python agent on port 23 speaking
# telnet -- real telnet, not a raw socket wearing the name. It unescapes IAC
# inbound, doubles it outbound, and accepts BINARY (RFC 856) in both
# directions, which is what keeps a tar stream intact. Verified with the
# worst case it can meet: 4096 bytes of 0xFF (the IAC byte itself) followed
# by all 256 byte values, round-tripped byte-identical.
#
# It is not a shell, because RISC OS has none in the POSIX sense -- no pipes
# to a child, no `&&`. anyvm sends shell one-liners; the agent recognises the
# two tar shapes and services them with Python's tarfile, prints the
# completion marker itself where a shell would have got it from the chained
# `&& echo`, and hands everything else to the command line interpreter with
# output redirected to a scrap file. It also holds a persistent session --
# several commands down one connection -- because that is what build.py's
# telnet_exec does; a one-command-per-connection agent looks like a guest
# that hangs up after the first probe.
#
# WHY telnet AND NOT the raw-tcp helpers anyvm.py also carries: because
# telnet is the transport that is actually finished. _tar_push_tcp /
# _tar_pull_tcp exist (written for redox, which never shipped) but nothing
# else does -- there is no tcp readiness probe, no `-- cmd` passthrough, no
# interactive-shell fallback, no reconnect hint, and build.py cannot even
# emit "tcp" into profile.json. Choosing tcp would have meant writing all
# seven of those from scratch as brand-new untested paths. Choosing telnet
# costs one `os_name == "riscos"` branch in each of _tar_push_telnet /
# _tar_pull_telnet -- a dispatch that is per-OS by design and already has
# plan9 and reactos arms -- and nothing at all in build.py.
#
# Python is not something this builder installs: RISC OS Open's image ships
# Python 2.7.2 at $.Programming.Python.!Python27 with a complete standard
# library, tarfile included.
VM_TRANSPORT=telnet

# The readiness probe build.py runs against the guest. The default is Plan 9
# rc syntax, where the `''` split stops the shell's echo of the typed line
# from matching the marker, and reactos needs cmd.exe's caret for the same
# reason. Neither applies here -- the agent is not a shell and never echoes
# what it was sent -- so the marker can be spelled plainly. `Echo` is
# capitalised because that is how RISC OS spells it.
VM_TELNET_PROBE_CMD="Echo anyvm-ready"
VM_TELNET_PROBE_MARKER="anyvm-ready"

# ---------------------------------------------------------------------------
# No keyboard -- why there is no console-driven install here
# ---------------------------------------------------------------------------
# The BCM2835 ROM ships NO USB keyboard driver. Its USB tree has
# USBDriver/build/c/usbmouse and nothing for keyboards, the boot prints
# "No keyboard present - autobooting", and a whole boot's worth of USB
# traffic is ep0 control transfers with zero interrupt-endpoint packets.
# Every HID device is reported as [error &24425355] -- &24425355 is ASCII
# "USB$", USBDriver's "attached, no driver" tag.
#
# So build.py's usual install path (string() / enter() / waitForText()
# driving a console) cannot exist for this guest, and neither can OCR: there
# is nothing to type into. The install is offline instead --
# hooks/host_beforeBuild.sh patches the disc image before first boot, the
# same shape as blissos-builder's offline construction. files/rofilecore.py
# is the tool: it parses FileCore's "BigDir" directories out of the raw
# image and overwrites one cosmetic boot script IN PLACE (same byte length,
# so no directory or allocation-map surgery).
#
# Three things about that image will bite anyone who touches it:
#
#   1. The live boot tree does not exist in a freshly downloaded image.
#      RISC OS copies $.!Boot.RO530Hook.Boot into $.!Boot.Choices.Boot on
#      FIRST boot. Patch the pristine image and you have patched a template
#      that is never run. This builder patches the RO530Hook template on
#      purpose, so the live copy is born patched.
#   2. Prefix every injected command with X. `*X <cmd>` runs it and discards
#      any error. Without it one error stops the boot on a dialog that waits
#      for a keypress -- and there is no keyboard, so the VM is simply gone.
#      RISC OS's own boot files do this (`X Pin ...`, `X RMLoad ...`).
#   3. Injected scripts must print NOTHING. A Tasks hook runs under the Wimp,
#      and any console output opens the single-tasking output screen, which
#      waits for a keypress at the end. Same brick, different cause.
#
# The hook targets a Tasks file, not a PreDesk one: PreDesk runs before the
# desktop exists, where the WimpSlot the Python interpreter needs fails with
# `error &1C1 -- 6200K free memory is needed before the application will
# start`. Tasks files run once the desktop is up.
#
# Intentionally unset: VM_LOGIN_TAG / VM_LOGIN_MAX_SECONDS / VM_OCR /
# VM_USE_CONSOLE_BUILD / VM_INSTALL_CMD / VM_INSTALL_SCRIPT /
# VM_PRE_INSTALL_PKGS -- all of them assume a console or a package manager,
# and this guest has neither.

# ---------------------------------------------------------------------------
# Guest hardware
# ---------------------------------------------------------------------------
# The engine's armv7 branch launches -M raspi2b with the ROM as -bios, the
# image on the SD interface, and the NIC as a USB device. Nothing here is
# PCI: the Pi has no PCI bus at all, so the usual virtio-*-pci defaults
# cannot apply.
#
# NIC: usb-net-smsc95xx, the model this repo adds. The Pi 2's real NIC is an
#   SMSC LAN9512 hanging off the on-chip USB hub, RISC OS has a driver for
#   it, and it has a driver for nothing else QEMU can offer -- no virtio-net,
#   no e1000. Without this device the guest has no networking and therefore
#   no way to reach the agent.
# VGA: none. Video is the BCM2835 framebuffer through the mailbox, not a
#   PCI display adapter.
VM_NIC=usb-net-smsc95xx
VM_VGA=none

# The ROM. Extracted from the FAT boot partition of ROOL's own image by
# hooks/host_beforeBuild.sh, so it is always the ROM that matches the
# release rather than a separately downloaded one.
VM_BIOS="build/RISCOS.IMG"

# QEMU's SD card model requires a power-of-two image size, and ROOL's image
# is 1966080000 bytes. The hook pads it to 4G; anyvm.py never resizes, so
# this is also the runtime disk size.
VM_DISK_SIZE=4G

# Both of these are fixed by the board, not preferences: raspi2b models a
# Pi 2 with 1 GB of RAM and four Cortex-A7 cores, and QEMU refuses to start
# if -m or -smp says anything else. The engine defaults (6144 MB, 2 CPUs)
# would both be rejected, so they have to be pinned here. RISC OS then
# reports "RISC OS 960MB" -- the GPU split takes the remainder.
VM_MEMORY=1024
VM_CPU=4

# The disc is on the SD interface; the board has no disk controller and no
# PCI bus to put one on, and SDFS is what RISC OS reads it with.
VM_DISK="sd"

# *Shutdown is RISC OS's orderly shutdown: it broadcasts to Wimp tasks,
# closes files and dismounts discs, and on this machine QEMU then exits on
# its own, so the engine's normal wait is enough with no force-kill.
#
# It only works once the DESKTOP is up. Sent while a single-tasking program
# holds the machine it does nothing at all -- which is the other reason the
# agent runs inside a TaskWindow (see files/tasks-anyvm.obey).
VM_SHUTDOWN_CMD="X Shutdown"
VM_SHUTDOWN_MAX_SECONDS=600

# File sync: tar, streamed over the raw TCP channel above and serviced by
# the agent's Python tarfile. Verified by round trip -- text and 16 KB of
# binary covering all 256 byte values, byte-identical in both directions,
# with RISC OS's own name mapping (hello.txt <-> hello/txt) applied by
# UnixLib on the way through.
#
# Everything else was ruled out on the actual guest, not assumed:
#   ssh family (rsync/sshfs/scp)  no sshd, no ssh client, no port of either.
#   9P                            no client.
#   NFS                           RISC OS has LanMan/Sunfish clients only as
#                                 third-party apps, none in this image.
#   Fat32FS share                 the module (1.63) IS loaded and could in
#                                 principle carry files on the FAT boot
#                                 partition, but it serves removable media
#                                 and does not see the SD card's own boot
#                                 partition -- ::0, ::4 and ::PiBoot all
#                                 resolve to nothing. (Fat32Map, despite the
#                                 name, is a DOS-extension-to-filetype table,
#                                 not a disc mapping.)
VM_SYNC_METHODS="tar"
